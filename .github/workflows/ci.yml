name: CI Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: npm install --ignore-scripts --frozen-lockfile

    - name: Run ESLint
      run: npm run eslint .